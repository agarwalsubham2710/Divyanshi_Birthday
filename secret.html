<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container fade">

  <!-- TOP MESSAGE (AS IT IS) -->
  <h1>😏 You unlocked my heart</h1>
  <p>Ye end nahi hai…<br>
    ye bas ek start hai 💫<br>
    Jo bhi hai humare beech…<br>
    wo cute hai, real hai, aur special hai ❤️<br><br>
    "Some bonds don’t need a name,
    they just feel right…" 💖</p>

  <hr>

  <!-- QUESTION -->
  <h2>Secret Question 💭</h2>
  <p>Sach sach batao… main tumhara best friend hoon ya thoda jada? Agar jada tho kya ha batao 😏”</p>

  <input type="text" id="answer" placeholder="Type your answer..."><br><br>

  <!-- SAVE -->
  <button id="saveBtn" disabled>Save 💾</button>
  <br><br>

  <!-- HOME BUTTON -->
  <button id="homeBtn" disabled>Go to Home 🏠</button>

</div>

<script src="script.js"></script>

<script>
let input = document.getElementById("answer");
let saveBtn = document.getElementById("saveBtn");
let homeBtn = document.getElementById("homeBtn");

// enable save
input.addEventListener("input", () => {
  saveBtn.disabled = input.value.trim() === "";
});

// save click
saveBtn.onclick = function(){
  let ans = input.value;

  sendData({
    name: "HerName",
    q3: ans   // secret question
  })
  .then(() => {
    alert("Saved ❤️");
  })
  .catch(() => {
    alert("Save failed ❌ (but continuing)");
  })
  .finally(() => {
    // always enable home button
    homeBtn.disabled = false;
    saveBtn.disabled = true;
  });
};

// home click
homeBtn.onclick = function(){
  window.location.href = "index.html"; // HOME PAGE
};
</script>

<audio id="bgMusic" autoplay loop>
  <source src="Songs/secret.mp3">
</audio>

</body>
</html>
