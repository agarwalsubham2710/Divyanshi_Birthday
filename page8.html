<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div class="container fade">
  <h2>Tell me 💭</h2>
  <p>Agar ek wish mile… toh tum humare relation me kya change karna chahogi</p>
  <input type="text" id="answer" placeholder="Type your answer..."><br><br>
  <button id="saveBtn" disabled>Save 💾</button>
  <br>
  <button id="nextBtn" disabled>Next ➡️</button>  
</div>

<script src="script.js"></script>

<script>
let input = document.getElementById("answer");
let saveBtn = document.getElementById("saveBtn");
let nextBtn = document.getElementById("nextBtn");

// enable save on typing
input.addEventListener("input", () => {
  saveBtn.disabled = input.value.trim() === "";
});

// save click
saveBtn.onclick = function(){
  let ans = input.value;

  sendData({
    name: "HerName",
    q2: ans
  }).then(() => {
    alert("Saved ❤️");
    nextBtn.disabled = false;
    saveBtn.disabled = true;
  });
};

// next click
nextBtn.onclick = function(){
  nextPage("page9.html");
};
</script>

<audio id="bgMusic" autoplay loop>
  <source src="Songs/song8.mp3">
</audio>

</body>
</html>
